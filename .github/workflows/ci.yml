name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # research_tests import torch, web3 and eth-tester; CPU-only torch keeps the install small.
      - run: pip install -e ".[dev,research]" -r requirements-extension.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: pytest -q
      - run: python -m unittest discover -s research_tests -v
